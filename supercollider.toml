# The static SuperCollider UGens of the release (scripts/build-sc-static.py).
# Paths are relative to the repository root.
#
# A UGen made from a Faust instrument: one [[ugen]] table.
#
# dsp:    the Faust source.
# class:  the class name for Faust (-cn). The static load function is
#         <class>_Load.
#
# Each SuperCollider class of isospin starts with "Iso" and a capital letter.
# The build gives each Faust UGen this prefix: the Faust name "woodbar" becomes
# the class IsoWoodbar. For a hand-written UGen, the build stops if a class
# does not have the prefix.
#
# The help page of a Faust UGen is the Markdown file next to its Faust source
# (woodbar.md for woodbar.dsp); the build stops if it is missing. The build
# writes the class methods from the Faust description: each control needs a
# [tooltip:...], which is its argument text.
#
# A hand-written C++ UGen: one [[native]] table. The release gets its sources
# and the headers of its folder in src/<name>/, without change. See
# native/include/isospin/sc_plugin_table.h for the rules of the wrapper
# source; tests/fixtures/native/fixture is a small example.
#
# name:    the folder name in the output (src/<name>/).
# dir:     the folder of the UGen.
# core:    the DSP core sources, relative to dir. They must not include
#          SuperCollider headers, so that the tests can use them alone.
# plugin:  the UGen wrapper sources, relative to dir.
# classes: the SuperCollider class files, relative to dir.
# load:    the load function, with C++ linkage: void <load>(InterfaceTable*).
# tests:   test programs, relative to dir, usually in its test/ folder. Each
#          is built with the core sources and the sanitizers and must exit
#          with 0 (scripts/check-native.py). They are not in the release.
# notice:  optional. A sentence for NOTICE.md, for example about code that
#          the UGen adapts from other projects and their licences.
#
# The help page of each class is the Markdown file next to its class file
# (IsoSuperPos.md for IsoSuperPos.sc); the build stops if it is missing. Its
# "## Class methods" section has a "### *ar" heading for each class method
# and an argument table with the arguments of the class file, in the same
# order; the build stops if they differ.

[[ugen]]
dsp = "woodbar.dsp"
class = "Woodbar"

[[native]]
name = "SuperPos"
dir = "native/superpos"
core = ["superpos_core.cpp"]
plugin = ["SuperPos.cpp", "SuperPosLive.cpp"]
classes = ["IsoSuperPos.sc", "IsoSuperPosLive.sc"]
load = "SuperPos_Load"
tests = ["test/superpos_core_test.cpp", "test/superpos_live_test.cpp", "test/superpos_fuzz.cpp"]
notice = """\
`superpos_core.cpp` adapts code from SuperCollider (Copyright (c) 2002 James \
McCartney, GPL-2.0-or-later, used under GPL-3.0) and from Mutable Instruments \
Clouds (Copyright 2014 Emilie Gillet, MIT). The notice at the top of that file \
gives the details and the MIT licence text."""

[[native]]
name = "Pulsar"
dir = "native/pulsar"
core = ["pulsar_core.cpp"]
plugin = ["Pulsar.cpp"]
classes = ["IsoPulsar.sc"]
load = "Pulsar_Load"
tests = ["test/pulsar_core_test.cpp"]
notice = """\
`pulsar_core.cpp` adapts code from SuperCollider (Copyright (c) 2002 James \
McCartney, GPL-2.0-or-later, used under GPL-3.0). The notice at the top of \
that file gives the details."""
