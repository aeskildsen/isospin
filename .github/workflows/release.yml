# Makes a GitHub release when a version tag (v1.2.3) is pushed. The release
# holds:
#
#   - the static SuperCollider UGen sources made by scripts/build-sc-static.py
#     (isospin-sc-static-<version>.tar.gz), for engines that link the UGens
#     into the server, such as SuperSonic;
#   - the loadable SuperCollider plugin for each platform, made from that
#     tarball by scripts/build-sc-plugin.py
#     (isospin-sc-<version>-<platform>.zip);
#   - the SHA-256 of each file.
#
# Faust comes from a pinned nixpkgs revision (in sc-plugin.yml), so that the
# tarball is the same, byte for byte, as a local build with the same Faust.
# Change NIXPKGS only on purpose: a new Faust version can change the generated
# sources.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The build checks of check.yml, on the tagged commit. No release when they
  # fail.
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    uses: ./.github/workflows/sc-plugin.yml
    with:
      release-tag: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.ref_name }}-sc-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in *.zip; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          faust=$(tar -xOzf isospin-sc-static-*.tar.gz --wildcards '*/BUILDINFO' | sed -n 's/^faust=//p')
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "isospin $GITHUB_REF_NAME" \
            --notes "SuperCollider plugin of isospin for Linux, macOS and Windows (isospin-sc-*.zip; the README.md in each zip says how to install it), and the static SuperCollider UGen sources (isospin-sc-static), made with $faust. Check each download with its .sha256 file."
